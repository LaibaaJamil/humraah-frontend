<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Hum-Raah - Knowledge & Resource Sharing Platform for Nonprofits in Pakistan">
  <meta name="theme-color" content="#0F766E">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Hum-Raah">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Hum-Raah</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body { margin: 0; background-color: #F8FAFC; font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; }
    #loader {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #0F766E, #0B5953); z-index: 9999;
      transition: opacity 0.4s ease; flex-direction: column;
    }
    #loader.hidden { opacity: 0; pointer-events: none; }
    .logo {
      width: 80px; height: 80px; background: rgba(255,255,255,0.15); border-radius: 20px;
      display: flex; align-items: center; justify-content: center; margin-bottom: 20px;
      border: 1px solid rgba(255,255,255,0.25);
    }
    .logo svg { width: 40px; height: 40px; color: white; }
    .title { color: white; font-size: 28px; font-weight: 800; letter-spacing: 0.5px; }
    .subtitle { color: rgba(255,255,255,0.85); font-size: 13px; margin-top: 6px; }
    .spinner {
      margin-top: 30px; width: 24px; height: 24px;
      border: 2px solid rgba(255,255,255,0.3); border-top-color: white;
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loader">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 12.75c1.63 0 3.07.39 4.24.9 1.08.48 1.76 1.56 1.76 2.73L18 18H6l0-1.61c0-1.18.68-2.26 1.76-2.73 1.17-.52 2.61-.91 4.24-.91zM4 13c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm1.13 1.1c-.37-.06-.74-.1-1.13-.1-.99 0-1.93.21-2.78.58A2.01 2.01 0 0 0 0 16.43V18h4.5v-1.61c0-.83.23-1.61.63-2.29zM20 13c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm4 3.43c0-.81-.48-1.53-1.22-1.85A6.95 6.95 0 0 0 20 14c-.39 0-.76.04-1.13.1.4.68.63 1.46.63 2.29V18H24v-1.57zM12 6c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3z"/>
      </svg>
    </div>
    <div class="title">Hum-Raah</div>
    <div class="subtitle">Loading your platform...</div>
    <div class="spinner"></div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('loader');
      if (loader) {
        loader.classList.add('hidden');
        setTimeout(() => loader.remove(), 500);
      }
    });
  </script>
</body>
</html>
