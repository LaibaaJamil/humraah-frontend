name: humraah
description: Hum-Raah - Knowledge & Resource Sharing Platform for Nonprofits in Pakistan
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  google_fonts: ^6.2.1
  go_router: ^14.2.7
  fl_chart: ^0.68.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  url_launcher: ^6.3.0
  file_picker: ^10.3.2
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10+1
  lucide_icons: ^0.257.0
  image_picker: ^1.2.2
  socket_io_client: ^2.0.3+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#0B4F5C"
  adaptive_icon_foreground: assets/icon/app_icon.png

flutter:
  uses-material-design: true